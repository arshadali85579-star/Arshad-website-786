<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e12" />
      <stop offset="50%" stop-color="#141a22" />
      <stop offset="100%" stop-color="#07090b" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbe052" />
      <stop offset="100%" stop-color="#d4b31a" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#222b37" stroke-width="0.8" stroke-dasharray="2 2" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#grid)" opacity="0.4" />

  <!-- Outer Architectural Border Rail -->
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#f7f4ee" stroke-width="1" stroke-dasharray="4 4" opacity="0.2" />

  <!-- Abstract Kinetic Developer Silhouette -->
  <circle cx="400" cy="380" r="160" fill="#161c24" stroke="#fbe052" stroke-width="1.5" stroke-dasharray="6 4" />
  <circle cx="400" cy="380" r="120" fill="#1b222d" />
  
  <!-- Monogram Initials -->
  <text x="400" y="415" font-family="'Archivo', sans-serif" font-weight="900" font-size="110" fill="#fbe052" text-anchor="middle" letter-spacing="4">SA</text>

  <!-- Shoulders / Torso Geometric Arc -->
  <path d="M 180 840 C 220 590, 580 590, 620 840 Z" fill="#12171f" stroke="#fbe052" stroke-width="1" stroke-dasharray="3 3" />
  <path d="M 230 840 C 260 640, 540 640, 570 840 Z" fill="#18202b" />

  <!-- Orbiting Lines -->
  <ellipse cx="400" cy="380" rx="260" ry="110" fill="none" stroke="#fbe052" stroke-width="1" stroke-dasharray="8 6" transform="rotate(-18 400 380)" opacity="0.7" />
  <ellipse cx="400" cy="380" rx="290" ry="80" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="4 4" transform="rotate(24 400 380)" opacity="0.3" />

  <!-- Header Metadata -->
  <text x="70" y="85" font-family="'Space Mono', monospace" font-size="14" fill="#948e82" letter-spacing="3">SAYYAD ARSHAD // PORTRAIT</text>
  <text x="730" y="85" font-family="'Space Mono', monospace" font-size="14" fill="#fbe052" text-anchor="end" letter-spacing="3">IN / 414201</text>

  <!-- Footer Metadata -->
  <text x="70" y="930" font-family="'Space Mono', monospace" font-size="13" fill="#676258" letter-spacing="2">B.E. ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE</text>
  <text x="730" y="930" font-family="'Space Mono', monospace" font-size="13" fill="#f7f4ee" text-anchor="end" letter-spacing="2">CREATIVE WEBGL DEVELOPER</text>
</svg>
